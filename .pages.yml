# ==========================================
# Pages CMS 配置文件 (.pages.yml)
# ==========================================

# 1. 媒体资源与全局上传设置
media:
  input: public/images
  output: /images

# 2. 内容与配置文件映射
content:

  # ----------------------------------------
  # 模块 1：博客文章 (src/content/posts)
  # ----------------------------------------
  - name: posts
    label: 📝 博客文章
    type: collection
    path: src/content/posts
    filename: "{fields.slug}.md"
    format: yaml-frontmatter
    view:
      fields: [title, published, draft, category]
      primary: title
      sort: [published]
      order: desc
    fields:
      - name: title
        label: 文章标题
        type: string
        required: true

      - name: published
        label: 发布日期
        type: date
        required: true

      - name: description
        label: 文章摘要
        type: text

      - name: image
        label: 封面图
        type: image

      - name: category
        label: 文章分类
        type: string

      - name: tags
        label: 标签列表
        type: list
        field:
          type: string

      - name: draft
        label: 设为草稿
        type: boolean
        default: false

      - name: body
        label: 文章正文
        type: rich-text

  # ----------------------------------------
  # 模块 2：特殊/独立页面 (src/content/spec)
  # ----------------------------------------
  - name: spec_pages
    label: 📄 特殊页面 (About / 友链等)
    type: collection
    path: src/content/spec
    filename: "{fields.slug}.md"
    format: yaml-frontmatter
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: 页面标题
        type: string
        required: true

      - name: description
        label: 页面描述
        type: text

      - name: body
        label: 页面内容
        type: rich-text

  # ----------------------------------------
  # 模块 3：Public 静态资源目录与附件管理
  # ----------------------------------------
  - name: public_root
    label: 📁 Public 根目录文件 (PDF/Zip等)
    type: collection
    path: public
    exclude: ["images/**", "favicon.*"]
    view:
      fields: [file]
      primary: file
    fields:
      - name: file
        label: 上传文件至 public 根目录
        type: file

  - name: public_images
    label: 🖼️ Public/images 图片库
    type: collection
    path: public/images
    view:
      fields: [file]
      primary: file
    fields:
      - name: file
        label: 上传图片
        type: image

  # ----------------------------------------
  # 模块 4：站点 TS 核心配置文件 (src/config/)
  # ----------------------------------------
  - name: site_config
    label: ⚙️ 1. 站点基础配置 (siteConfig.ts)
    type: file
    path: src/config/siteConfig.ts
    format: raw
    fields:
      - name: body
        label: 代码编辑器
        type: code

  - name: profile_config
